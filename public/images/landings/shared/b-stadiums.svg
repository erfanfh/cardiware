      <stop offset="0" stop-color="#0C1310"/>
      <stop offset="1" stop-color="#070C0A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#DFFFE8" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#DFFFE8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="640" fill="url(#bg)"/>
  <!-- نورافکن‌ها -->
  <g>
    <polygon points="300,0 380,0 620,420 480,470" fill="url(#beam)"/>
    <polygon points="1540,0 1620,0 1440,470 1300,420" fill="url(#beam)"/>
    <rect x="322" y="10" width="36" height="10" rx="4" fill="#DFFFE8" opacity="0.85"/>
    <rect x="1562" y="10" width="36" height="10" rx="4" fill="#DFFFE8" opacity="0.85"/>
